[project]
name = "pygeoapi-provider-harness"
version = "0.1.0"
description = "Probe worker and contract checks for pygeoapi providers (pygeoapi Provider Builder)"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "pygeoapi==0.24.0",
]

[project.scripts]
pygeoapi-provider-harness-worker = "pygeoapi_provider_harness.worker:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pygeoapi_provider_harness"]
