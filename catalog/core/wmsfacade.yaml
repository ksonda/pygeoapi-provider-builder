descriptor_version: 1
id: WMSFacade
plugin: WMSFacade
provider_type: map
origin: core
title: Maps from a WMS
summary: Publish layers of an OGC Web Map Service (WMS) as OGC API - Maps.
ogc_api: [maps]
source: [pygeoapi/provider/wms_facade.py]
docs: https://docs.pygeoapi.io/en/latest/publishing/ogcapi-maps.html#wmsfacade
requires: [requests, pyproj]
probe: {kind: map}
egress: {kind: url, keys: [data]}
notes:
  - >-
    Every map request becomes a GetMap request to the WMS, for a PNG in the
    storage CRS. pygeoapi sets no timeout, so a slow WMS holds a server worker
    until it answers.
  - >-
    pygeoapi sends the style as written here. Some servers reject the name
    "default": then give the WMS's own style name.
fields:
  - key: data
    type: url
    title: WMS URL
    help: >-
      The WMS address, without GetMap parameters. A query string the service
      needs (such as map=… for MapServer) may stay.
    required: true
    step: connect
    source: pygeoapi/provider/wms_facade.py:124

  - key: options.layer
    type: string
    title: Layers
    help: The WMS layer name, or several separated by commas, drawn in that order.
    required: true
    step: connect
    source: pygeoapi/provider/wms_facade.py:113

  - key: options.style
    type: string
    title: Style
    help: The WMS style name to ask for.
    default: default
    step: connect
    source: pygeoapi/provider/wms_facade.py:114

  - key: options.version
    type: enum
    title: WMS version
    help: >-
      1.3.0 sends crs= and puts latitude first for EPSG:4326; 1.1.1 sends srs=
      with longitude first.
    choices: ['1.3.0', '1.1.1']
    default: '1.3.0'
    advanced: true
    step: connect
    source: pygeoapi/provider/wms_facade.py:92

  # The facade's only output format is png (OUTPUT_FORMATS, wms_facade.py:44-46).
  - key: format.name
    type: enum
    help: pygeoapi's WMS facade asks for PNG only.
    choices: [png]

  - key: format.mimetype
    type: enum
    choices: [image/png]

examples:
  - id: docs
    source: docs/source/publishing/ogcapi-maps.rst:106-117
    provider:
      type: map
      name: WMSFacade
      data: https://demo.mapserver.org/cgi-bin/msautotest
      options:
        layer: world_latlong
        style: default
        version: 1.3.0
      format:
        name: png
        mimetype: image/png
      storage_crs: http://www.opengis.net/def/crs/EPSG/0/4326
