descriptor_version: 1
id: CSV
plugin: CSV
provider_type: feature
origin: core
title: CSV file
summary: Publish a CSV file with coordinate columns as OGC API - Features.
ogc_api: [features]
source: [pygeoapi/provider/csv_.py]
docs: https://docs.pygeoapi.io/en/latest/publishing/ogcapi-features.html#csv
requires: []
capabilities:
  bbox: true
  datetime: false
  properties: true
  sortby: false
  select_properties: true
  skip_geometry: true
  q: false
  hits: true
  cql: false
  transactions: false
probe: {kind: feature}
introspect: {what: csv, needs: [data]}
notes:
  - pygeoapi reads the whole file on every request. That's fine for small files.
  - Only point geometries, from two coordinate columns.
hide: [editable]
fields:
  - key: data
    type: path
    title: CSV file
    required: true
    extensions: [.csv]
    step: connect
    source: pygeoapi/provider/csv_.py:73

  - key: geometry.x_field
    type: field
    title: X (longitude) column
    required: true
    choices_from: introspect.columns
    step: connect
    source: pygeoapi/provider/csv_.py:61

  - key: geometry.y_field
    type: field
    title: Y (latitude) column
    required: true
    choices_from: introspect.columns
    step: connect
    source: pygeoapi/provider/csv_.py:62

  - key: id_field
    type: field
    title: Identifier column
    help: >-
      Required in practice: pygeoapi reads it for every row, and a missing or
      wrong column fails every request.
    required: true
    choices_from: introspect.columns
    step: connect
    source: pygeoapi/provider/csv_.py:168

  - key: properties
    type: field[]
    title: Published properties
    help: >-
      Publish only these properties. pygeoapi's CSV provider treats the list
      as a set, so it doesn't keep this order.
    choices_from: probe.fields
    step: map
    source: pygeoapi/provider/csv_.py:180

examples:
  - id: docs
    source: docs/source/publishing/ogcapi-features.rst:63-76
    provider:
      type: feature
      name: CSV
      data: tests/data/obs.csv
      id_field: id
      geometry:
        x_field: long
        y_field: lat
      crs:
        - http://www.opengis.net/def/crs/EPSG/0/28992
        - http://www.opengis.net/def/crs/OGC/1.3/CRS84
        - http://www.opengis.net/def/crs/EPSG/0/4326
