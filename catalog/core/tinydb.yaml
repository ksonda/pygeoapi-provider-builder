descriptor_version: 1
id: TinyDB
plugin: TinyDB
provider_type: feature
origin: core
title: TinyDB GeoJSON file
summary: Publish GeoJSON features kept in a TinyDB JSON file, with optional editing.
ogc_api: [features]
source: [pygeoapi/provider/tinydb_.py]
docs: https://docs.pygeoapi.io/en/latest/publishing/ogcapi-features.html#tinydb
requires: [tinydb]
capabilities:
  bbox: true
  datetime: true
  properties: true
  sortby: true             # by the first sortby key only
  select_properties: false # accepted, never applied
  skip_geometry: false     # accepted, never applied
  q: false
  hits: true
  cql: false
  transactions: true
probe: {kind: feature, copy_data: true}  # TinyDB opens a file it thinks it may write for writing
notes:
  - Each document must be a GeoJSON feature; its id becomes the item's id.
  - >-
    pygeoapi opens the file read-only when it can't write to it, so edits
    (editable) need a file the server may write.
fields:
  - key: data
    type: path
    title: TinyDB file
    help: The TinyDB JSON file that holds the features.
    extensions: [.db, .json, .tinydb]
    required: true
    step: connect
    source: pygeoapi/provider/tinydb_.py:69

  - key: id_field
    title: Identifier property
    help: The property that identifies each feature in queryables and HTML pages.
    choices_from: probe.fields
    step: map

examples:
  - id: docs
    source: docs/source/publishing/ogcapi-features.rst:862-868
    provider:
      type: feature
      editable: true|false
      name: TinyDB
      data: /path/to/file.db
      id_field: identifier
      time_field: datetimefield
