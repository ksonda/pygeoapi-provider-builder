descriptor_version: 1
id: MVT-postgresql
plugin: MVT-postgresql
provider_type: tile
origin: core
title: Vector tiles from a PostGIS table
summary: >-
  Render Mapbox vector tiles from a PostGIS table on the fly (ST_AsMVT), as
  OGC API - Tiles.
ogc_api: [tiles]
source: [pygeoapi/provider/mvt_postgresql.py, pygeoapi/provider/sql.py]
docs: https://docs.pygeoapi.io/en/latest/publishing/ogcapi-tiles.html#mvt-postgresql
requires: [sqlalchemy, geoalchemy2, psycopg2]
probe: {kind: tile}
introspect: {what: sql, dialect: postgresql}
egress: {kind: sql, default_port: 5432}
hide: [options.schemes]
drift_ignore:
  - {key: count, reason: Tiles are not counted, source: 'pygeoapi/provider/base.py:70'}
  - {key: file_types, reason: Read only by the FileSystem and Azure STAC providers, source: 'pygeoapi/provider/base.py:80'}
  - {key: time_field, reason: Tiles have no time filter, source: 'pygeoapi/provider/base.py:77'}
  - {key: x_field, reason: Not read by tile providers, source: 'pygeoapi/provider/base.py:74'}
  - {key: y_field, reason: Not read by tile providers, source: 'pygeoapi/provider/base.py:75'}
  - {key: z_field, reason: Not read by tile providers, source: 'pygeoapi/provider/base.py:76'}
  - {key: data.database, reason: Undocumented alias of data.dbname; the form writes dbname, source: 'pygeoapi/provider/sql.py:607'}
  - {key: data.query, reason: Stored but never used by pygeoapi, source: 'pygeoapi/provider/sql.py:609'}
notes:
  - >-
    PostGIS renders each tile when it's asked for; it needs protobuf-c
    support, and storage_crs must be the geometry column's CRS.
  - The table name becomes the tile layer's name.
  - >-
    Tiling schemes can't be set: pygeoapi 0.24 passes the provider's options,
    tile settings included, to the database driver, and a scheme list stops it
    loading (sql.py:620-627). Both WebMercatorQuad and WorldCRS84Quad are offered.
variants:
  - id: fields
    title: Connection details
    fields:
      - key: data.host
        type: string
        title: Host
        required: true
        help: The database host as the pygeoapi server sees it.
        step: connect
        source: pygeoapi/provider/sql.py:604
      - key: data.port
        type: integer
        title: Port
        default: 5432
        min: 1
        max: 65535
        step: connect
        source: pygeoapi/provider/sql.py:605
      - key: data.dbname
        type: string
        title: Database
        required: true
        step: connect
        source: pygeoapi/provider/sql.py:607
      - key: data.user
        type: string
        title: User
        required: true
        step: connect
        source: pygeoapi/provider/sql.py:603
      - key: data.password
        type: secret
        title: Password
        required: true
        env_name: DB_PASSWORD
        step: connect
        source: pygeoapi/provider/sql.py:610
      - key: data.search_path
        type: string[]
        title: Schemas to search
        help: Schemas searched in order for the table; the first match wins.
        default: [public]
        step: connect
        source: pygeoapi/provider/sql.py:615
  - id: dsn
    title: Connection string
    help: A SQLAlchemy URL such as postgresql://user:password@host:5432/dbname.
    fields:
      - key: data
        type: secret
        title: Connection string
        required: true
        format: postgresql-dsn
        env_name: DB_DSN
        step: connect
        source: pygeoapi/provider/sql.py:597
      - key: options.search_path
        type: string[]
        title: Schemas to search
        default: [public]
        step: connect
        drift: passthrough
        source: pygeoapi/provider/sql.py:616
fields:
  - key: table
    type: string
    title: Table or view
    required: true
    help: A table, view or materialized view name, without the schema.
    choices_from: introspect.tables
    step: connect
    source: pygeoapi/provider/sql.py:115

  - key: id_field
    type: field
    title: Identifier column
    help: A unique column. pygeoapi treats it as the primary key, so views work too.
    required: true
    choices_from: introspect.columns
    step: connect
    source: pygeoapi/provider/sql.py:116

  - key: geom_field
    type: field
    title: Geometry column
    help: If the column doesn't exist, items are published without geometry.
    default: geom
    choices_from: introspect.geometry_columns
    step: connect
    source: pygeoapi/provider/sql.py:117

  - key: options.connect_timeout
    type: integer
    title: Connect timeout
    unit: s
    min: 1
    advanced: true
    step: connect
    drift: passthrough
    source: pygeoapi/resources/schemas/config/pygeoapi-config-0.x.yml:725

  - key: options.pool_size
    type: integer
    title: Connection pool size
    default: 5
    min: 1
    advanced: true
    step: connect
    drift: passthrough
    source: pygeoapi/provider/sql.py:636

  - key: options.pool_timeout
    type: integer
    title: Pool timeout
    unit: s
    default: 30
    advanced: true
    step: connect
    drift: passthrough
    source: pygeoapi/provider/sql.py:639

  - key: storage_crs
    type: crs
    title: Storage CRS
    help: The geometry column's CRS. pygeoapi transforms features from it into each tile.
    default: http://www.opengis.net/def/crs/OGC/1.3/CRS84
    step: connect
    source: pygeoapi/provider/base.py:86

  - key: format.name
    suggest: pbf

  - key: format.mimetype
    suggest: application/vnd.mapbox-vector-tile

examples:
  - id: docs
    variant: fields
    source: docs/source/publishing/ogcapi-tiles.rst:150-170
    provider:
      type: tile
      name: MVT-postgresql
      data:
        host: 127.0.0.1
        port: 3010
        dbname: test
        user: postgres
        password: postgres
        search_path: [osm, public]
      id_field: osm_id
      table: hotosm_bdi_waterways
      geom_field: foo_geom
      storage_crs: http://www.opengis.net/def/crs/EPSG/0/4326
      options:
        zoom:
          min: 0
          max: 15
      format:
        name: pbf
        mimetype: application/vnd.mapbox-vector-tile
