descriptor_version: 1
id: ElasticsearchCatalogue
plugin: ElasticsearchCatalogue
provider_type: record
origin: core
title: Elasticsearch metadata catalogue
summary: Publish an Elasticsearch 8 index of metadata records as OGC API - Records.
ogc_api: [records]
source: [pygeoapi/provider/elasticsearch_.py]
docs: https://docs.pygeoapi.io/en/latest/publishing/ogcapi-records.html#elasticsearchcatalogue
requires: [elasticsearch, elasticsearch_dsl]
capabilities:
  bbox: true
  datetime: true
  properties: true
  sortby: true
  select_properties: true
  skip_geometry: true
  q: true
  hits: true
  cql: true
  transactions: true
probe: {kind: record}
egress: {kind: url, keys: [data]}
notes:
  - >-
    Each document in the index must be a GeoJSON feature, and the index
    mapping must make geometry a geo_shape.
  - >-
    Records must be OGC API - Records GeoJSON features.
variants:
  - id: url
    title: An address without a password
    fields:
      - key: data
        type: url
        title: Index URL
        help: The server and index, such as http://search.example.org:9200/places.
        pattern: '^https?://[^/]+/[^/]+$'
        required: true
        step: connect
        source: pygeoapi/provider/elasticsearch_.py:68
  - id: secret
    title: An address with a username and password
    help: >-
      The whole address, credentials included, stays in an environment
      variable on the server, such as http://user:password@host:9200/places.
    fields:
      - key: data
        type: secret
        title: Index URL with credentials
        env_name: INDEX_URL
        required: true
        step: connect
        source: pygeoapi/provider/elasticsearch_.py:68

fields:
  - key: id_field
    title: Identifier property
    help: The property of each document that identifies it.
    required: true
    step: connect

examples:
  - id: docs
    variant: url
    source: docs/source/publishing/ogcapi-records.rst:47-52
    provider:
      type: record
      name: ElasticsearchCatalogue
      data: http://localhost:9200/some_metadata_index
      id_field: identifier
      time_field: datetimefield
