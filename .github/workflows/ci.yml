# Every suite (`make check`, PLAN.md §12) on pushes to main and on pull requests:
# lint, types, citations against the pinned sources, drift check, unit tests,
# contract tests in geopython/pygeoapi:0.24.0, integration tests on the dev
# stack, and Playwright E2E with axe.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true

      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Python dependencies
        run: uv sync --frozen

      - name: Source repositories the docs cite, at pinned commits
        run: make vendor

      - name: Frontend dependencies and Chromium
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: The pinned pygeoapi image
        run: docker pull geopython/pygeoapi:0.24.0

      - name: make check
        run: make check

      - name: Playwright traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: frontend/test-results/
          if-no-files-found: ignore

      - name: Dev stack logs
        if: failure()
        run: docker compose -f docker/compose.yaml logs --no-color
