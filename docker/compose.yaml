# Dev stack for pygeoapi Provider Builder: `make stack-up` / `make stack-down`.
#
# - pygeoapi: the sandbox image (the pinned geopython/pygeoapi:0.24.0 plus the
#   spec engine's dependencies; `make images`), run like the stock image: root,
#   /entrypoint.sh, serving docker/pygeoapi/pygeoapi.config.yml (gitignored; make
#   stack-up copies pygeoapi.config.seed.yml when it's missing). The builder's
#   dev-stack target edits that file and recreates this container, whose
#   entrypoint regenerates OpenAPI. The spec engine's source and the
#   workspace's specs are mounted, so created providers can be published here.
# - postgis: seeded with pygeoapi's own test data (tests/data/hotosm_bdi_waterways.sql.gz:
#   schema `osm`, table `hotosm_bdi_waterways`), as pygeoapi's CI does, plus
#   postgis/21-demo-sql.sql: a table to join it to, and a read-only role (pb_reader).
#   imresamu/postgis is the multi-arch build by a docker-postgis maintainer; the
#   official postgis/postgis images are amd64-only.
# - mockapi: docker/mock-api/mock_api.py, the JSON API Mode B tests and demos use.
name: provider-builder-dev

services:
  pygeoapi:
    image: provider-builder/sandbox:0.24.0   # make images tags the current build with this name
    user: root
    entrypoint: ["/entrypoint.sh"]
    ports:
      - "127.0.0.1:5080:80"   # not 5000: macOS AirPlay Receiver listens there
    environment:
      PYGEOAPI_CONFIG: /config/pygeoapi.config.yml
      PYTHONPATH: /opt/runtime:/opt/devpath   # devpath: code-built providers' src (sitecustomize.py)
      PYGEOAPI_SPEC_PRIVATE_HOSTS: mockapi   # the mock API has a private address
    env_file:
      - ./pygeoapi/pygeoapi.env        # secrets for the dev stack (gitignored; created by make)
    volumes:
      - ./pygeoapi:/config:ro          # a directory mount, so atomic file replaces are seen
      - ./data:/data                   # writable: pygeoapi's GeoPackage provider writes to .gpkg
      - ../runtime/src:/opt/runtime:ro
      - ./pygeoapi/devpath:/opt/devpath:ro
      - ../workspace/providers:/specs:ro
    depends_on:
      postgis:
        condition: service_healthy
      mockapi:
        condition: service_healthy

  mockapi:
    image: geopython/pygeoapi:0.24.0   # Flask and gunicorn are already in the pinned image
    user: "10001:0"
    read_only: true
    # --reload: edits to mock_api.py take effect without recreating the container
    entrypoint: ["/venv/bin/gunicorn", "--bind", "0.0.0.0:8000", "--workers", "2", "--reload",
                 "--worker-tmp-dir", "/tmp", "--chdir", "/opt/mock", "mock_api:app"]
    tmpfs: [/tmp]
    ports:
      - "127.0.0.1:8090:8000"
    volumes:
      - ./mock-api:/opt/mock:ro
    healthcheck:
      test: ["CMD", "/venv/bin/python3", "-c",
             "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 2s
      timeout: 3s
      retries: 30

  postgis:
    image: imresamu/postgis:17-3.6
    environment:
      POSTGRES_DB: test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - ../vendor/pygeoapi/tests/data/hotosm_bdi_waterways.sql.gz:/fixtures/hotosm_bdi_waterways.sql.gz:ro
      - ./postgis/20-load-fixtures.sh:/docker-entrypoint-initdb.d/20-load-fixtures.sh:ro
      - ./postgis/21-demo-sql.sql:/docker-entrypoint-initdb.d/21-demo-sql.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d test && psql -U postgres -d test -tAc \"select 1 from osm.hotosm_bdi_waterways limit 1\" | grep -q 1"]
      interval: 3s
      timeout: 5s
      retries: 60

networks:
  default:
    name: provider-builder-dev
