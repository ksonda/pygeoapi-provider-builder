secure-wells:
    type: collection
    title: Wells behind an ArcGIS login
    description: Wells behind an ArcGIS login (pygeoapi test data)
    keywords:
        - test
    extents:
        spatial:
            bbox: [-117.2, 42.0, -111.1, 48.9]
            crs: http://www.opengis.net/def/crs/OGC/1.3/CRS84
    providers:
        - type: feature
          name: ESRI
          data: http://mockapi:8000/arcgis/rest/services/SecureWells/FeatureServer/0
          id_field: OBJECTID
          username: reader
          password: ${PYGEOAPI_SECURE_WELLS_ESRI_PASSWORD}
          token_service: http://mockapi:8000/arcgis/sharing/rest/generateToken
          referer: http://mockapi:8000
