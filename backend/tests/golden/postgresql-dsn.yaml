drains:
    type: collection
    title: Drains
    description: A materialized view
    keywords:
        - water
    extents:
        spatial:
            bbox: [29.0, -4.5, 30.9, -2.3]
            crs: http://www.opengis.net/def/crs/OGC/1.3/CRS84
    providers:
        - type: feature
          name: PostgreSQL
          data: ${PYGEOAPI_DRAINS_DB_DSN}
          options:
              search_path:
                  - osm
              connect_timeout: 10
          table: hotosm_bdi_drains
          id_field: osm_id
          geom_field: foo_geom
