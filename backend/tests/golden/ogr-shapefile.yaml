addresses-shp:
    type: collection
    title: Dutch addresses (Shapefile)
    description: Dutch addresses (Shapefile) (pygeoapi test data)
    keywords:
        - test
    extents:
        spatial:
            bbox: [5.67, 52.04, 5.83, 52.13]
            crs: http://www.opengis.net/def/crs/OGC/1.3/CRS84
    providers:
        - type: feature
          name: OGR
          data:
              source_type: ESRI Shapefile
              source: /data/dutch_addresses_shape_4326/inspireadressen.shp
              source_options:
                  ADJUST_GEOM_TYPE: FIRST_SHAPE
              gdal_ogr_options:
                  SHPT: POINT
          layer: inspireadressen
          id_field: fid
