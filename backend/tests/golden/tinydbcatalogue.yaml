canada-records:
    type: collection
    title: Canadian open data records
    description: Canadian open data records (pygeoapi test data)
    keywords:
        - test
    extents:
        spatial:
            bbox: [-142, 41, -52, 84]
            crs: http://www.opengis.net/def/crs/OGC/1.3/CRS84
    providers:
        - type: record
          name: TinyDBCatalogue
          data: /data/canada-records.tinydb
          id_field: externalId
          title_field: title
          time_field: created
