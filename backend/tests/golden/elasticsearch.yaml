places-es:
    type: collection
    title: Elasticsearch test
    description: Elasticsearch test (pygeoapi test data)
    keywords:
        - test
    extents:
        spatial:
            bbox: [-180.0, -90.0, 180.0, 90.0]
            crs: http://www.opengis.net/def/crs/OGC/1.3/CRS84
    providers:
        - type: feature
          name: Elasticsearch
          data: ${PYGEOAPI_PLACES_ES_INDEX_URL}
          id_field: geonameid
          time_field: datetimefield
