lakes-oracle:
    type: collection
    title: OracleDB test
    description: OracleDB test (pygeoapi test data)
    keywords:
        - test
    extents:
        spatial:
            bbox: [-180.0, -90.0, 180.0, 90.0]
            crs: http://www.opengis.net/def/crs/OGC/1.3/CRS84
    providers:
        - type: feature
          name: OracleDB
          data:
              host: oracle.example.org
              service_name: XEPDB1
              user: geo
              password: ${PYGEOAPI_LAKES_ORACLE_DB_PASSWORD}
          table: lakes
          id_field: id
          geom_field: geometry
          sdo_operator: sdo_relate
          title_field: name
          mandatory_properties:
              - group_id
