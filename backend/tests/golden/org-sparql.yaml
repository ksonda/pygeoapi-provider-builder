obs-sparql:
    type: collection
    title: pygeoapi-plugins/SPARQL test
    description: pygeoapi-plugins/SPARQL test (pygeoapi test data)
    keywords:
        - test
    extents:
        spatial:
            bbox: [-122, 43, -75, 49]
            crs: http://www.opengis.net/def/crs/OGC/1.3/CRS84
    providers:
        - type: feature
          name: pygeoapi_plugins.provider.sparql.SPARQLProvider
          data: /data/obs.csv
          sparql_provider: CSV
          id_field: id
          geometry:
              x_field: long
              y_field: lat
          sparql_query:
              endpoint: https://graph.geoconnex.us/repositories/iow
              bind:
                  name: uri
                  variable: ?subject
              where:
                  - predicate: schema:name
                    object: ?name
              prefixes:
                  schema: <https://schema.org/>
