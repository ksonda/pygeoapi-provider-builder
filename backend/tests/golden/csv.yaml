obs:
    type: collection
    title: Observations
    description: Weather station observations
    keywords:
        - weather
        - observations
    extents:
        spatial:
            bbox: [-122, 43, -75, 49]
            crs: http://www.opengis.net/def/crs/OGC/1.3/CRS84
        temporal:
            begin: 2000-10-30T18:24:39Z
            end: null
    providers:
        - type: feature
          name: CSV
          data: /data/obs.csv
          geometry:
              x_field: long
              y_field: lat
          id_field: id
          time_field: datetime
