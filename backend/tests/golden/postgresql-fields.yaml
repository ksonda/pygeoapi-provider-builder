waterways:
    type: collection
    title: Waterways of Burundi
    description: HOT OSM waterways
    keywords:
        - water
    extents:
        spatial:
            bbox: [29.0, -4.5, 30.9, -2.3]
            crs: http://www.opengis.net/def/crs/OGC/1.3/CRS84
    providers:
        - type: feature
          name: PostgreSQL
          data:
              host: postgis
              dbname: test
              user: postgres
              password: ${PYGEOAPI_WATERWAYS_DB_PASSWORD}
              search_path:
                  - osm
                  - public
          table: hotosm_bdi_waterways
          id_field: osm_id
          geom_field: foo_geom
