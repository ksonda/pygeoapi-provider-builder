obs-geopandas:
    type: collection
    title: pygeoapi-plugins/GeoPandas test
    description: pygeoapi-plugins/GeoPandas test (pygeoapi test data)
    keywords:
        - test
    extents:
        spatial:
            bbox: [-122, 43, -75, 49]
            crs: http://www.opengis.net/def/crs/OGC/1.3/CRS84
    providers:
        - type: feature
          name: pygeoapi_plugins.provider.geopandas_.GeoPandasProvider
          data: /data/obs.csv
          id_field: id
          geometry:
              x_field: long
              y_field: lat
