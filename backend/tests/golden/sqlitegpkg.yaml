poi-portugal:
    type: collection
    title: Points of interest in Portugal
    description: OSM POIs
    keywords:
        - poi
    extents:
        spatial:
            bbox: [-9.5, 36.9, -6.2, 42.2]
            crs: http://www.opengis.net/def/crs/OGC/1.3/CRS84
    providers:
        - type: feature
          name: SQLiteGPKG
          data: /data/poi_portugal.gpkg
          table: poi_portugal
          id_field: osm_id
          title_field: name
