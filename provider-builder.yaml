# Development settings for pygeoapi Provider Builder.
# Relative paths are resolved against this file's directory.
# Settings are read-only in the v1 UI; see backend/provider_builder/settings.py.

data_roots:
  - name: sample-data
    host_path: docker/data          # filled by `make fixtures`
    server_path: /data              # where the dev pygeoapi container sees it

targets:
  - id: dev-stack
    title: Local dev stack (docker compose)
    kind: file                      # edited in place: backup, atomic write, reload, verify
    base_config: docker/pygeoapi/pygeoapi.config.yml   # gitignored; make stack-up seeds it
    server_url: http://localhost:5080
    # Recreate, not restart: a new container rereads pygeoapi.env, and the image's
    # entrypoint regenerates OpenAPI at start (docs/pygeoapi-notes.md §9).
    reload: command
    reload_command: [docker, compose, -f, docker/compose.yaml, up, -d, --no-deps,
                     --force-recreate, --wait, pygeoapi]
    verify_timeout_s: 90
    # Collections' JSON-LD templates (Geoconnex options): docker/pygeoapi is /config there.
    templates_dir:
      host_path: docker/pygeoapi/templates     # gitignored, written by publishes
      server_path: /config/templates

catalogs: [catalog]

sandbox:
  runner: auto                      # docker when available, else a local subprocess
  # image: built from docker/sandbox by `make images` when not set
  egress_network: provider-builder-dev   # the gateway joins the dev stack's network
  private_hosts: [postgis, mockapi]      # the dev stack's services may be private addresses
  timeout_s: 60

workspace:
  host_path: workspace/providers    # created providers, one Git repo each (gitignored)
  server_path: /specs               # where the dev pygeoapi container sees their specs

geoconnex: true

state_dir: .provider-builder        # backups and the publish log (gitignored)

allowed_hosts: [127.0.0.1, localhost]
allowed_origins:
  - http://127.0.0.1:8765
  - http://localhost:8765
  - http://127.0.0.1:5173
  - http://localhost:5173
